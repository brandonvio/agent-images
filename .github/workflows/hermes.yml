# Build and publish brandonvio/hermes to Docker Hub.
#
# This workflow is self-contained: it is triggered only by changes to its own
# image directory and to this file, it never triggers or waits on another
# workflow, and no other workflow triggers or waits on it. The five image
# workflows in this directory are independent by design.
#
# Each architecture builds natively and pushes by digest only. Tags are applied
# once, in the merge job, after every architecture's smoke test has passed — so
# a build that fails smoke publishes no tag at all and `latest` never regresses.
#
# hermes builds on the published agent-base, resolved to a digest below.

name: hermes

on:
  push:
    branches: [main]
    paths:
      - 'hermes/**'
      - '.github/workflows/hermes.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  IMAGE: brandonvio/hermes

jobs:
  resolve-base:
    name: resolve agent-base
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.base.outputs.ref }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: brandonvio
          password: ${{ secrets.DOCKER_PAT }}

      # Resolved once, here, so both architecture legs provably build on the
      # same base. Resolving the tag independently in each leg could straddle
      # an agent-base publish and ship one index whose legs disagree.
      #
      # This reads the published image from Docker Hub like any other external
      # base image. It is not a dependency on the agent-base workflow: nothing
      # here waits for, triggers, or is gated by that workflow's runs.
      - name: Resolve the published agent-base to a digest
        id: base
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect brandonvio/agent-base:latest \
                      --format '{{ .Manifest.Digest }}')"
          test -n "$digest"
          echo "ref=brandonvio/agent-base@${digest}" >> "$GITHUB_OUTPUT"
          echo "building on brandonvio/agent-base@${digest}"

  build:
    name: build ${{ matrix.arch }}
    needs: resolve-base
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      # These builds have already died on a full runner. This is a requirement,
      # not an optimization.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          docker image prune -af || true
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: brandonvio
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and push by digest
        id: build
        run: |
          set -euo pipefail
          export PINS_JSON="$(cat hermes/pins.json)"
          export SOURCE_COMMIT="${GITHUB_SHA}"
          export BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export BUILD_VERSION="${GITHUB_RUN_NUMBER}"
          export BUILDX_NO_DEFAULT_ATTESTATIONS=1
          export AGENT_BASE_IMAGE="${{ needs.resolve-base.outputs.ref }}"
          cache="$IMAGE:buildcache-${{ matrix.arch }}"
          cd hermes
          docker buildx bake hermes \
            --set "hermes.tags=" \
            --set "hermes.platform=linux/${{ matrix.arch }}" \
            --set "hermes.cache-from=type=registry,ref=${cache}" \
            --set "hermes.cache-to=type=registry,ref=${cache},mode=max,image-manifest=true,oci-mediatypes=true" \
            --set "hermes.output=type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/bake-metadata.json
          digest="$(jq -r '.["hermes"]["containerimage.digest"]' /tmp/bake-metadata.json)"
          test -n "$digest" && test "$digest" != "null"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "built $IMAGE@$digest"

      # Smoke the exact bytes that were pushed, pulled back by digest, rather
      # than a locally-loaded sibling.
      - name: Smoke the published digest
        run: |
          set -euo pipefail
          ref="$IMAGE@${{ steps.build.outputs.digest }}"
          docker pull "$ref"
          make -C hermes smoke IMAGE_REF="$ref"

      - name: Record digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge and tag
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: brandonvio
          password: ${{ secrets.DOCKER_PAT }}

      - name: Create the manifest list and apply every tag at once
        run: |
          set -euo pipefail
          sha12="$(echo "${GITHUB_SHA}" | cut -c1-12)"
          refs=""
          for f in /tmp/digests/*; do
            refs="$refs $IMAGE@$(cat "$f")"
          done
          echo "assembling:$refs"
          docker buildx imagetools create \
            --tag "$IMAGE:${GITHUB_RUN_NUMBER}" \
            --tag "$IMAGE:sha-${sha12}" \
            --tag "$IMAGE:latest" \
            $refs
          docker buildx imagetools inspect "$IMAGE:latest"
