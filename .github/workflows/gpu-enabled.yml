# Build and publish brandonvio/gpu-enabled to Docker Hub.
#
# This workflow is self-contained: it is triggered only by changes to its own
# image directory and to this file, it never triggers or waits on another
# workflow, and no other workflow triggers or waits on it. The five image
# workflows in this directory are independent by design.
#
# Each architecture builds natively and pushes by digest only. Tags are applied
# once, in the merge job, after every architecture's smoke test has passed — so
# a build that fails smoke publishes no tag at all and `latest` never regresses.
#
# amd64 only: the CUDA wheels this image exists to bake in are x86_64.

name: gpu-enabled

on:
  push:
    branches: [main]
    paths:
      - 'gpu-enabled/**'
      - '.github/workflows/gpu-enabled.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  IMAGE: brandonvio/gpu-enabled

jobs:
  build:
    name: build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
    steps:
      # These builds have already died on a full runner. This is a requirement,
      # not an optimization.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          docker image prune -af || true
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: brandonvio
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and push by digest
        id: build
        run: |
          set -euo pipefail
          export PINS_JSON="$(cat gpu-enabled/pins.json)"
          export SOURCE_COMMIT="${GITHUB_SHA}"
          export BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export BUILD_VERSION="${GITHUB_RUN_NUMBER}"
          cache="$IMAGE:buildcache-${{ matrix.arch }}"
          cd gpu-enabled
          docker buildx bake gpu-enabled \
            --set "gpu-enabled.platform=linux/${{ matrix.arch }}" \
            --set "gpu-enabled.cache-from=type=registry,ref=${cache}" \
            --set "gpu-enabled.cache-to=type=registry,ref=${cache},mode=max,image-manifest=true,oci-mediatypes=true" \
            --set "gpu-enabled.output=type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/bake-metadata.json
          digest="$(jq -r '.["gpu-enabled"]["containerimage.digest"]' /tmp/bake-metadata.json)"
          test -n "$digest" && test "$digest" != "null"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "built $IMAGE@$digest"

      # Smoke the exact bytes that were pushed, pulled back by digest, rather
      # than a locally-loaded sibling.
      - name: Smoke the published digest
        run: |
          set -euo pipefail
          ref="$IMAGE@${{ steps.build.outputs.digest }}"
          docker pull "$ref"
          make -C gpu-enabled smoke IMAGE_REF="$ref"

      - name: Record digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge and tag
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: brandonvio
          password: ${{ secrets.DOCKER_PAT }}

      - name: Create the manifest list and apply every tag at once
        run: |
          set -euo pipefail
          sha12="$(echo "${GITHUB_SHA}" | cut -c1-12)"
          refs=""
          for f in /tmp/digests/*; do
            refs="$refs $IMAGE@$(cat "$f")"
          done
          echo "assembling:$refs"
          docker buildx imagetools create \
            --tag "$IMAGE:${GITHUB_RUN_NUMBER}" \
            --tag "$IMAGE:sha-${sha12}" \
            --tag "$IMAGE:latest" \
            $refs
          docker buildx imagetools inspect "$IMAGE:latest"
